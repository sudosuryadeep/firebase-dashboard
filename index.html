
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0b1020;
    color: #f1f5ff;
    font-family: Arial, sans-serif;
}

header {
    padding: 23px 6%;
    border-bottom: 1px solid #26334d;
    font-size: 21px;
    font-weight: bold;
}

header span { color: #8295ff; }

main {
    max-width: 950px;
    width: 92%;
    margin: 45px auto;
}

.card {
    background: #151e32;
    border: 1px solid #2b3955;
    border-radius: 17px;
    padding: 25px;
    margin-bottom: 22px;
}

h1 { font-size: 32px; }

p { color: #9caecb; }

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #344462;
    background: #0b1325;
    color: white;
    border-radius: 9px;
}

button {
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    background: #7186ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: #899aff; }

pre {
    background: #080e1b;
    border-radius: 12px;
    padding: 20px;
    overflow: auto;
    max-height: 550px;
    color: #b6d6ff;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.hidden { display: none; }

.status { color: #8ba1ff; }
</style>
</head>

<body>

<header>Firebase<span>Panel</span></header>

<main>
    <section class="card">
        <h1>Database Dashboard</h1>
        <p>Private read-only Firebase data viewer</p>
    </section>

    <section class="card" id="login">
        <h2>Admin Login</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password"
               placeholder="Dashboard password">
        <button onclick="connect()">Connect</button>
        <p id="loginStatus"></p>
    </section>

    <section class="card hidden" id="panel">
        <h2>Firebase Data</h2>
        <p class="status" id="status">Connected</p>
        <button onclick="loadData()">Refresh Data</button>
        <pre id="output">Loading...</pre>
    </section>
</main>

<script>
let auth = "";

async function connect() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (!username || !password) {
        document.getElementById("loginStatus").textContent =
            "Enter username and password";
        return;
    }

    auth = "Bearer " + password;

    await loadData();
}

async function loadData() {
    const status = document.getElementById("status");

    status.textContent = "Connecting...";

    try {
        const response = await fetch("/api/data", {
            headers: { "Authorization": auth },
            cache: "no-store"
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Request failed");
        }

        document.getElementById("output").textContent =
            JSON.stringify(result.data, null, 2);

        document.getElementById("login").classList.add("hidden");
        document.getElementById("panel").classList.remove("hidden");

        status.textContent = "● Connected successfully";

    } catch (error) {
        document.getElementById("loginStatus").textContent =
            error.message;
        status.textContent = error.message;
    }
}
</script>

</body>
</html>
